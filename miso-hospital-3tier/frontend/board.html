<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미소 병원 - 진료 문의</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vuln-tooltip.css">
</head>
<body>
    <div class="board-container">
        <header>
            <h2>진료 문의 게시판</h2>
            <span class="user-info">접속자: 김환자 님</span>
        </header>

        <section class="write-section">
            <h3>
                증상 남기기
                <span class="vuln-badge"
                      data-vuln-title="Stored XSS"
                      data-vuln-desc="등록된 제목/내용을 이스케이프 없이 innerHTML로 그대로 렌더링합니다."
                      data-vuln-attack="제목에 &lt;script&gt;alert(document.cookie)&lt;/script&gt; 를 입력하고 등록해보세요. 알림창이 뜨면 스크립트가 실행된 것입니다.">!</span>
            </h3>
            <form id="inquiryForm">
                <div class="input-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" placeholder="어디가 불편하신가요?">
                </div>
                <div class="input-group">
                    <label for="content">상세 증상</label>
                    <textarea id="content" rows="4" placeholder="증상을 상세히 적어주세요."></textarea>
                </div>
                <button type="submit" class="btn-primary">문의 등록</button>
            </form>
        </section>

        <section class="list-section">
            <h3>
                나의 문의 내역
                <span class="vuln-badge"
                      data-vuln-title="BOLA / IDOR"
                      data-vuln-desc="문의 링크의 patient_id 파라미터만으로 조회하며, 서버가 로그인 사용자와 일치 여부를 검증하지 않습니다."
                      data-vuln-attack="문의 클릭 후 이동한 view.html 주소창의 patient_id 값을 102, 103 등으로 바꿔보세요. 타인의 진료 문의가 그대로 보입니다.">!</span>
            </h3>
            <ul id="inquiryList"></ul>
        </section>
    </div>

    <script src="js/board.js"></script>
    <script src="js/vuln-tooltip.js"></script>
</body>
</html>
